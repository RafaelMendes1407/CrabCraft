[package]
name = "rc-cargo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Cargo.lock and dependency requirements (C-03).
semver = "1"
toml = "1"
# The crates.io sparse index, for the newest version of a dependency.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "gzip", "system-proxy"] }
rc-core = { path = "../rc-core" }
# Process handling and the build, run and test events the UI already understands.
rc-dotnet = { path = "../rc-dotnet" }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
