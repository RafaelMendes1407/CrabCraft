[package]
name = "rc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CrabCraft: a lightweight native IDE for Rust"

[[bin]]
name = "crabcraft"
path = "src/main.rs"

[dependencies]
fallible-iterator = "0.3"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits", "extra_check"] }
anyhow.workspace = true
tempfile = "3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Dependency versions in Cargo.toml (C-02, C-04).
semver = "1"
# The HTTP Client (F-03): the same client and runtime the other crates use.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "gzip", "system-proxy"] }
tokio.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
rc-text.workspace = true
rc-syntax.workspace = true
rc-editor.workspace = true
rc-kit.workspace = true
rc-core.workspace = true
rc-dotnet.workspace = true
rc-cargo.workspace = true
rc-lsp.workspace = true
rc-term.workspace = true
rc-search.workspace = true
rc-vcs.workspace = true
rc-dap.workspace = true
rfd = "0.17"
dirs = "6"
muda = { version = "0.21", default-features = false }
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark", "load-images"] }
egui_extras = { version = "0.36", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Stopping perf with SIGINT (A-01).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

# Linux: Vulkan (or OpenGL ES where there is none), on X11 and Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "persistence", "x11", "wayland"] }

[dev-dependencies]
egui_kittest.workspace = true

[build-dependencies]
embed-resource = "3.0"
