[workspace]
members = ["."]

[package]
name = "crabcraft-security-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
rc-core = { path = "../crates/rc-core" }
rc-cargo = { path = "../crates/rc-cargo" }

[[bin]]
name = "session_input"
path = "fuzz_targets/session_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cargo_manifest"
path = "fuzz_targets/cargo_manifest.rs"
test = false
doc = false
bench = false
