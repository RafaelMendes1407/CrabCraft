# Builds the Linux and Windows downloads. Pushing a tag such as v0.1.0 publishes them as a GitHub
# release with its notes taken from CHANGELOG.md. "Run workflow" only builds them, as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # 22.04 (glibc 2.35) so the binary also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --release -p rc-app

      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          dir=CrabCraft-$version
          mkdir -p "$dir"
          install -m 755 target/release/crabcraft packaging/linux/install.sh "$dir/"
          install -m 644 assets/icon.png "$dir/crabcraft.png"
          install -m 644 assets/crabcraft.desktop "$dir/"
          python3 scripts/copy_notices.py "$dir"
          "$dir/crabcraft" --version | grep -Fx "CrabCraft $version"
          tar -czf "CrabCraft-$version-linux-x86_64.tar.gz" "$dir"
          ldd "$dir/crabcraft"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: CrabCraft-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --release -p rc-app --target x86_64-pc-windows-msvc

      - name: Package the zip
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory CrabCraft | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/crabcraft.exe CrabCraft/CrabCraft.exe
          python scripts/copy_notices.py CrabCraft
          if ($LASTEXITCODE -ne 0) { throw "Copying license notices failed" }
          # GUI-subsystem executables need an explicit wait; PowerShell otherwise closes
          # its capture pipe before the process writes. Redirect to a file instead.
          $versionOutput = Join-Path $env:RUNNER_TEMP 'crabcraft-version.txt'
          $process = Start-Process -FilePath (Resolve-Path ./CrabCraft/CrabCraft.exe) -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionOutput
          $reported = (Get-Content -Raw $versionOutput).Trim()
          if ($process.ExitCode -ne 0 -or $reported -ne "CrabCraft $version") {
            throw "Packaged executable reported an unexpected version: $reported"
          }
          Compress-Archive -Path CrabCraft -DestinationPath "CrabCraft-$version-windows-x64.zip"
          # The exe must only need system DLLs (the C runtime is linked statically).
          $objdump = Get-ChildItem "$(rustc --print sysroot)/lib/rustlib" -Recurse -Filter llvm-objdump.exe | Select-Object -First 1
          $dlls = & $objdump.FullName -p CrabCraft/CrabCraft.exe | Select-String 'DLL Name: (.+)' | ForEach-Object { $_.Matches.Groups[1].Value }
          $dlls -join ', '
          $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|libgcc|libstdc|libwinpthread)' }
          if ($bad) { throw "Non-system DLLs: $($bad -join ', ')" }

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" packaging/windows/crabcraft.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            CrabCraft-*-windows-x64.zip
            CrabCraft-*-setup.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CrabCraft $version" --notes-file notes.md
