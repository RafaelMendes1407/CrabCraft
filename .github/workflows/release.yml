# Builds the Linux and Windows downloads. Pushing a tag such as v0.1.0 publishes them as a GitHub
# release with its notes taken from CHANGELOG.md. "Run workflow" only builds them, as artifacts.
name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/copy_notices.py
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # 22.04 (glibc 2.35) so the binary also runs on older distributions.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --release -p rc-app

      - name: Package
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rc-app"))')
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          dir=CrabCraft-$version
          mkdir -p "$dir"
          install -m 755 target/release/crabcraft packaging/linux/install.sh "$dir/"
          install -m 644 assets/icon.png "$dir/crabcraft.png"
          install -m 644 assets/crabcraft.desktop "$dir/"
          python3 scripts/copy_notices.py "$dir"
          "$dir/crabcraft" --version | grep -Fx "CrabCraft $version"
          tar -czf "CrabCraft-$version-linux-x86_64.tar.gz" "$dir"
          ldd "$dir/crabcraft"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: CrabCraft-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          if ($LASTEXITCODE -ne 0) { throw "Installing Rust and llvm-tools failed" }
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --release -p rc-app --target x86_64-pc-windows-msvc

      - name: Package the zip
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw "Reading Cargo metadata failed" }
          $version = (($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'rc-app').version
          if (-not $version) { throw "Cargo metadata has no application version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME does not match version $version"
          }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory CrabCraft | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/crabcraft.exe CrabCraft/CrabCraft.exe
          python scripts/copy_notices.py CrabCraft
          if ($LASTEXITCODE -ne 0) { throw "Copying license notices failed" }
          # GUI-subsystem executables need an explicit wait; PowerShell otherwise closes
          # its capture pipe before the process writes. Redirect to a file instead.
          $versionOutput = Join-Path $env:RUNNER_TEMP 'crabcraft-version.txt'
          $process = Start-Process -FilePath (Resolve-Path ./CrabCraft/CrabCraft.exe) -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionOutput
          $reported = "$(Get-Content -Raw $versionOutput)".Trim()
          if ($process.ExitCode -ne 0 -or $reported -ne "CrabCraft $version") {
            throw "Packaged executable reported an unexpected version: $reported"
          }
          # The exe must only need system DLLs (the C runtime is linked statically).
          $sysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { throw "Reading the Rust sysroot failed" }
          $objdump = Get-ChildItem "$sysroot/lib/rustlib" -Recurse -Filter llvm-objdump.exe | Select-Object -First 1
          if (-not $objdump) { throw "llvm-objdump is missing" }
          $imports = & $objdump.FullName -p CrabCraft/CrabCraft.exe
          if ($LASTEXITCODE -ne 0) { throw "Inspecting executable DLL imports failed" }
          $dlls = @($imports | Select-String 'DLL Name: (.+)' | ForEach-Object { $_.Matches.Groups[1].Value.Trim() })
          if (-not ($dlls -match '^KERNEL32\.dll$')) { throw "No system DLL imports were parsed" }
          $dlls -join ', '
          $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|libgcc|libstdc|libwinpthread)' }
          if ($bad) { throw "Non-system DLLs: $($bad -join ', ')" }
          Compress-Archive -Path CrabCraft -DestinationPath "CrabCraft-$version-windows-x64.zip"

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Installing Inno Setup failed" }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 compiler is missing" }
          & $compiler "/DVersion=$env:VERSION" packaging/windows/crabcraft.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            CrabCraft-*-windows-x64.zip
            CrabCraft-*-setup.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CrabCraft $version" --notes-file notes.md
