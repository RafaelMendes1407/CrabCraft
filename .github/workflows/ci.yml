# Builds the application and runs the tests that need no external tools, on Linux and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked -p rc-app

      - name: Test
        run: cargo test --locked -p rc-app -p rc-text -p rc-syntax -p rc-core -p rc-cargo --lib

  supply-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

  sbom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install SBOM generator
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all --target all
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: crabcraft-sbom
          path: '**/*.cdx.json'
          if-no-files-found: error
