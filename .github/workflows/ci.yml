# Builds the application on Linux and Windows, lints Windows-only code (Linux is linted by the
# security audit), runs every library test and the application's own tests. rc-app has no library
# target, so its tests only run with --bins.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked -p rc-app

      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Library tests
        run: cargo test --locked --workspace --lib --exclude rc-app

  app-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev
          # GDB 14+ for the DAP-based debugger tests (hence Ubuntu 24.04), Symbola for
          # emoji/symbol glyphs and Mesa's software Vulkan driver for wgpu-rendered tests.
          sudo apt-get install -y gdb fonts-symbola mesa-vulkan-drivers

      # Rust 1.99+ emits CodeView records that LLDB <23.1 cannot read on MSVC:
      # https://github.com/rust-lang/rust/issues/161657
      # LLVM's 23.x Windows release script builds LLDB against Python 3.11.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'

      - name: Install verified LLDB 23.1.5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.5-win64.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-win64.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '288ab326377157a9e02e6fb9724914cc2b55963882d493a405f31dc66e837c12') {
            throw "LLVM installer checksum mismatch"
          }
          # Administrative extraction keeps the runner's installed LLVM unchanged.
          $root = Join-Path $env:RUNNER_TEMP 'llvm-23.1.5'
          $process = Start-Process msiexec.exe -ArgumentList "/a `"$installer`" /qn TARGETDIR=`"$root`"" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Extracting LLVM failed: $($process.ExitCode)" }
          $adapter = Get-ChildItem $root -Recurse -Filter lldb-dap.exe | Select-Object -First 1
          if (-not $adapter) { throw "The LLVM package has no lldb-dap" }
          $bin = Split-Path -Parent $adapter.FullName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $adapter.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "lldb-dap did not start" }
          $version = (& (Join-Path $bin 'lldb.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '23\.1\.5') { throw "Unexpected LLDB version: $version" }
          $version

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rust-analyzer,rust-src
          rustup default stable

      - name: Configure Git for test repositories
        run: |
          git config --global user.name "CrabCraft CI"
          git config --global user.email "ci@example.invalid"
          git config --global core.autocrlf false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Application tests
        shell: bash
        run: cargo test --locked -p rc-app --bins -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/app-tests.log"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/app-tests.log
          if-no-files-found: warn
